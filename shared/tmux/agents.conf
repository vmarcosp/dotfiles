# Coding-agent awareness across every session. See shared/bin/agent-watch.
#
# status-right runs the scanner each tick: it updates @agent_state / @agent_icon on
# every window (the tab icons) and prints who needs you right now.
# Sourced after better-tmux (which clears status-right) and before TPM
# (continuum appends its autosave hook to whatever status-right holds).

set -g status-interval 3
set -g status-right-length 120
set -g status-right '#($HOME/.local/bin/agent-watch tick)'

# prefix + g  jump to the next window that needs you, in any session
# prefix + a  menu of every agent window, needs-you first
bind-key g run-shell '$HOME/.local/bin/agent-watch next'
bind-key a run-shell '$HOME/.local/bin/agent-watch menu "#{client_name}"'
