set -g prefix C-d
bind-key C-d send-prefix
unbind C-b
unbind C-Space
set -gu prefix2

set-window-option -g xterm-keys on

if-shell 'uname | grep -q Darwin' \
  'set-option -g default-command "reattach-to-user-namespace -l zsh"' \
  'set-option -g default-command "zsh"'

bind r source-file ~/.tmux.conf \; display " Reloaded "

set-option -g status-justify left

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run-shell '~/.tmux/plugins/tpm/tpm'
if-shell '[ -x "$HOME/.local/bin/better-tmux" ]' \
  'run-shell "$HOME/.local/bin/better-tmux --file $HOME/.config/better-tmux/index.tsx"'
# Omarchy theme-set paints a solid pane bg; drop it so Ghostty opacity shows through.
if-shell 'uname | grep -qv Darwin' \
  'set-option -g window-style default; set-option -g window-active-style default'
