<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Omarchy's 50-omarchy.conf uses qual="any" + assign on "monospace",
       so a named mono font also picks up JetBrains. Our old rule used
       qual="any" to prepend Inter and stole Space Mono in Ghostty
       (wide Inter cells). Only remap when the *first* family is the
       generic chain (monospace or Omarchy's JetBrains default). -->
  <match target="pattern">
    <test name="family" qual="first">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
</fontconfig>
