<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Inter for UI; IBM Plex as the next sans and the serif. Lives in conf.d so
       `omarchy font set` (which rewrites fonts.conf) cannot wipe it. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>IBM Plex Serif</string>
    </edit>
  </match>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
      <family>IBM Plex Sans</family>
    </prefer>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>

  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- Omarchy's packaged config aliases system-ui to Liberation Sans. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Liberation Sans</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <alias>
    <family>Inter</family>
    <accept>
      <family>IBM Plex Sans</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
